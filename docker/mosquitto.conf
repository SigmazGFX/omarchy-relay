listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# Offline delivery: Relay's apps keep a session on the broker, and messages
# sent while a device is offline wait in it. Drop a session unused for 30
# days, and let one hold up to 10000 messages (a 25 MB file is about 400).
persistent_client_expiration 30d
max_queued_messages 10000
log_dest file /mosquitto/log/mosquitto.log
